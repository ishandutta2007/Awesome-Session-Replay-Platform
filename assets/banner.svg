<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#38bdf8;#818cf8;#c084fc;#38bdf8"/></stop><stop offset="50%" stop-color="#818cf8"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#818cf8;#c084fc;#38bdf8;#818cf8"/></stop><stop offset="100%" stop-color="#c084fc"><animate attributeName="stop-color" dur="6s" repeatCount="indefinite" values="#c084fc;#38bdf8;#818cf8;#c084fc"/></stop></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}@keyframes play-glow{0%{filter:drop-shadow(0 0 8px rgba(56,189,248,.6))}50%{filter:drop-shadow(0 0 20px rgba(192,132,252,.9))}}@keyframes wave{0%{stroke-dashoffset:0}}.title{font-weight:800;font-size:52px;fill:url(#text-grad)}.badge,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8;letter-spacing:2px}.badge{font-weight:600;font-size:14px;fill:#38bdf8}.animated-play{transform-origin:150px 200px;animation:pulse 3s indefinite ease-in-out,play-glow 3s indefinite ease-in-out}.wave-line{stroke-dasharray:10 5;animation:wave 4s linear indefinite}</style></defs><rect width="1200" height="400" fill="url(#bg-grad)"/><rect width="1200" height="400" fill="url(#grid)"/><circle cx="150" cy="200" r="120" fill="#38bdf8" fill-opacity=".05"/><circle cx="1050" cy="120" r="160" fill="#c084fc" fill-opacity=".05"/><g class="animated-play"><circle cx="150" cy="200" r="48" fill="#1e293b" stroke="url(#text-grad)" stroke-width="4"/><polygon fill="url(#text-grad)" points="142 182 166 200 142 218"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="4" d="M 150 140 A 60 60 0 1 1 95 175" class="wave-line"/><polygon fill="#38bdf8" points="90 165 97 180 110 170"/></g><text x="240" y="170" class="title">AWESOME SESSION REPLAY</text><text x="240" y="215" class="subtitle">SaaS Platforms &amp; Open-Source Digital Experience Ecosystem</text><rect width="150" height="32" x="240" y="245" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><text x="315" y="266" class="badge" text-anchor="middle">⏺ Session Replay</text><rect width="130" height="32" x="405" y="245" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><text x="470" y="266" class="badge" text-anchor="middle">🔥 Heatmaps</text><rect width="160" height="32" x="550" y="245" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><text x="630" y="266" class="badge" text-anchor="middle">🛠 UX Analytics</text><rect width="170" height="32" x="725" y="245" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><text x="810" y="266" class="badge" text-anchor="middle">⚡ Open-Source</text><line x1="240" x2="1100" y1="320" y2="320" stroke="#334155" stroke-linecap="round" stroke-width="4"/><line x1="240" x2="650" y1="320" y2="320" stroke="url(#text-grad)" stroke-linecap="round" stroke-width="4"/><circle cx="650" cy="320" r="8" fill="#f43f5e" stroke="#fff" stroke-width="2"/><rect width="8" height="35" x="940" y="270" fill="#38bdf8" rx="4"><animate attributeName="height" dur="1.5s" repeatCount="indefinite" values="20;40;15;35;20"/><animate attributeName="y" dur="1.5s" repeatCount="indefinite" values="285;265;290;270;285"/></rect><rect width="8" height="45" x="955" y="260" fill="#818cf8" rx="4"><animate attributeName="height" dur="1.8s" repeatCount="indefinite" values="45;20;50;25;45"/><animate attributeName="y" dur="1.8s" repeatCount="indefinite" values="260;285;255;280;260"/></rect><rect width="8" height="30" x="970" y="275" fill="#c084fc" rx="4"><animate attributeName="height" dur="1.3s" repeatCount="indefinite" values="15;45;20;38;15"/><animate attributeName="y" dur="1.3s" repeatCount="indefinite" values="290;260;285;267;290"/></rect><rect width="8" height="40" x="985" y="265" fill="#f43f5e" rx="4"><animate attributeName="height" dur="1.6s" repeatCount="indefinite" values="35;15;42;20;35"/><animate attributeName="y" dur="1.6s" repeatCount="indefinite" values="270;290;263;285;270"/></rect></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-grad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; letter-spacing: 2px; }
      .badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }
      
      @keyframes play-glow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
        50% { filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.9)); }
      }

      @keyframes wave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -100; }
      }

      .animated-play { transform-origin: 150px 200px; animation: pulse 3s indefinite ease-in-out, play-glow 3s indefinite ease-in-out; }
      .wave-line { stroke-dasharray: 10 5; animation: wave 4s linear indefinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Decorative Glowing Circles -->
  <circle cx="150" cy="200" r="120" fill="#38bdf8" fill-opacity="0.05" />
  <circle cx="1050" cy="120" r="160" fill="#c084fc" fill-opacity="0.05" />

  <!-- Play Button Replay Icon -->
  <g class="animated-play">
    <circle cx="150" cy="200" r="48" fill="#1e293b" stroke="url(#text-grad)" stroke-width="4" />
    <polygon points="142,182 166,200 142,218" fill="url(#text-grad)" />
    <!-- Replay Arc -->
    <path d="M 150 140 A 60 60 0 1 1 95 175" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" class="wave-line"/>
    <polygon points="90,165 97,180 110,170" fill="#38bdf8"/>
  </g>

  <!-- Text Section -->
  <text x="240" y="170" class="title">AWESOME SESSION REPLAY</text>
  <text x="240" y="215" class="subtitle">SaaS Platforms &amp; Open-Source Digital Experience Ecosystem</text>

  <!-- Feature Pills / Badges -->
  <rect x="240" y="245" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="315" y="266" class="badge" text-anchor="middle">⏺ Session Replay</text>

  <rect x="405" y="245" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="470" y="266" class="badge" text-anchor="middle">🔥 Heatmaps</text>

  <rect x="550" y="245" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="630" y="266" class="badge" text-anchor="middle">🛠 UX Analytics</text>

  <rect x="725" y="245" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="810" y="266" class="badge" text-anchor="middle">⚡ Open-Source</text>

  <!-- Waveform / Timeline Scrubber Visualization -->
  <line x1="240" y1="320" x2="1100" y2="320" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="320" x2="650" y2="320" stroke="url(#text-grad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="650" cy="320" r="8" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>

  <!-- Animated Audio / Activity Equalizer Bars -->
  <rect x="940" y="270" width="8" height="35" rx="4" fill="#38bdf8">
    <animate attributeName="height" values="20;40;15;35;20" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="285;265;290;270;285" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="955" y="260" width="8" height="45" rx="4" fill="#818cf8">
    <animate attributeName="height" values="45;20;50;25;45" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="260;285;255;280;260" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="970" y="275" width="8" height="30" rx="4" fill="#c084fc">
    <animate attributeName="height" values="15;45;20;38;15" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="290;260;285;267;290" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="985" y="265" width="8" height="40" rx="4" fill="#f43f5e">
    <animate attributeName="height" values="35;15;42;20;35" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="270;290;263;285;270" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
